name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build print server (Node → exe)
        run: |
          cd print-server
          npm install
          npx pkg server.js --targets node18-win-x64 --output dist/pos-print-server.exe

      - name: Copy print server sidecar
        shell: pwsh
        run: |
          $triple = rustc -vV | Select-String "host:" | ForEach-Object { $_ -replace "host:\s*", "" }
          $triple = $triple.Trim()
          Copy-Item "print-server/dist/pos-print-server.exe" "src-tauri/binaries/pos-print-server-$triple.exe"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (all bundles)
        run: npx tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ""

      - name: Upload print server artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-print-server
          path: print-server/dist/pos-print-server.exe
          if-no-files-found: warn

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pos-food-windows-build
          path: |
            src-tauri/target/release/bundle/**/*
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
