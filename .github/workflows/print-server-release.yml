name: Build Print Server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-print-server:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: print-server/package-lock.json

      - name: Build print server (Node → exe)
        run: |
          cd print-server
          npm install
          npx pkg server.js --targets node18-win-x64 --output dist/pos-print-server.exe

      - name: Upload print server artifact
        uses: actions/upload-artifact@v4
        with:
          name: pos-print-server
          path: print-server/dist/pos-print-server.exe
